site_name: eKoNLPy
site_url: https://ekonlpy.entelecheia.ai
site_author: Young Joon Lee <yj.lee@chu.ac.kr>
site_description: Korean NLP tools for economic and financial text analysis
repo_name: entelecheia/eKoNLPy
repo_url: https://github.com/entelecheia/eKoNLPy
edit_uri: edit/master/docs/

nav:
  - Home: index.md
  - Installation: installation.md
  - Tagging: tagging.md
  - Dictionaries: dictionaries.md
  - Sentiment: sentiment.md
  - CLI reference: cli.md
  - Troubleshooting: troubleshooting.md
  - Contributing and verification: contributing.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: sphinx

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

theme:
  name: material
  favicon: https://assets.entelecheia.ai/favicon.png
  logo: https://assets.entelecheia.ai/favicon.png
  palette:
    scheme: slate
  features:
    - navigation.expand
    - navigation.indexes
    - content.action.edit
    - content.action.view
    - content.code.copy
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra:
  analytics:
    provider: google
    property: G-VMN7QWCMSV
