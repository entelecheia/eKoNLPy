---
name: lint & test

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"
      - "!release*"
      - "!test-release*"
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "Makefile"
      - ".python-version"
      - ".pre-commit-config.yaml"
      - ".github/workflows/lint_and_test.yaml"

permissions:
  contents: read

concurrency:
  group: lint-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: make install
      - run: make check
      - run: make docs-test

  build:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
    defaults:
      run:
        shell: bash
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime and test dependencies
        run: uv sync --no-default-groups --group test
      - name: Run tests with failure propagation
        run: UV_NO_SYNC=true make test
      - name: Check installed dependencies
        run: uv pip check
      - name: Build distributions
        run: uv build
      - name: Test installed wheel outside checkout
        run: |
          wheel=$(python -c 'from pathlib import Path; print(next(Path("dist").glob("*.whl")).resolve().as_posix())')
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --with "$wheel" --with 'pytest>=7.2.1' python -m pytest "$GITHUB_WORKSPACE/tests" -q
      - name: Test installed source distribution
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: |
          sdist=$(python -c 'from pathlib import Path; print(next(Path("dist").glob("*.tar.gz")).resolve().as_posix())')
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --with "$sdist" --with 'pytest>=7.2.1' python -m pytest "$GITHUB_WORKSPACE/tests" -q
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            tests/pytest-coverage.txt
            tests/pytest.xml
            coverage.xml
